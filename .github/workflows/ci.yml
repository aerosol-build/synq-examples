name: ci

# Builds both examples on every push to main, and on demand, against the
# @synqauth/* versions each package-lock.json pins from npm. No pull request
# trigger: Aerosol runs no PR checks. GitHub's hosted runners, never
# self-hosted ones: this repository is public, and anyone's fork could
# otherwise run code on our machines.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [nextjs-solana-login, expo-solana-login]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      # Next.js: `next build` with no SYNQ_* set, as a fresh clone has.
      # Expo: `expo export` bundles the Android app's JavaScript, every
      # import resolved, as a release build would.
      - name: Build
        run: npm run build
